spring.application.name=catalogue-loader
server.port=10001

# OpenAI compatible Config
spring.ai.openai.base-url=http://localhost:1234/v1
# (LM Studio doesn't care, but the Spring AI field can't be empty)
spring.ai.openai.api-key=lm-studio
spring.ai.openai.embedding.model=text-embedding-nomic-embed-text-v1.5

# Valkey Config
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Maximum size of a single uploaded file (e.g., 10MB)
spring.servlet.multipart.max-file-size=15MB

# Maximum size of the entire multipart/form-data request (e.g., 15MB)
spring.servlet.multipart.max-request-size=90MB

# Application Config
app.loader.index-name=product_index
app.loader.dimension=768

# Actuator
management.endpoints.web.exposure.include=health,info

# Enable the build info contributor in /actuator/info
management.info.build.enabled=true

# (Optional) Show detailed component health (Valkey/Redis, disk space, etc.)
management.endpoint.health.show-details=always