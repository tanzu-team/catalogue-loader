services:
  valkey:
    image: valkey/valkey-bundle:latest
    container_name: valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    cap_add:
      - SYS_PTRACE
    environment:
      - VALKEY_EXTRA_FLAGS=--save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  catalogue-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogue-loader
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_AI_OPENAI_BASE_URL=${SPRING_AI_OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY:-lm-studio}
      - SPRING_AI_OPENAI_EMBEDDING_MODEL=${SPRING_AI_OPENAI_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      - APP_LOADER_INDEX_NAME=${APP_LOADER_INDEX_NAME:-product_index}
      - APP_LOADER_DIMENSION=${APP_LOADER_DIMENSION:-768}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  valkey-data:
